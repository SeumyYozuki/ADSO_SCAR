<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Móvil Repartidor - SCAR Dulce Dip</title>
    <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/styles(Domi).css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">    
</head>
<body>

    <header class="app-header p-3 mb-3 shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-truck fs-3 text-warning"></i>
                <div>
                    <h6 class="fw-bold mb-0 text-light" style="color: #C6AF69 !important;">SCAR Domicilios</h6>
                    <small class="text-success"><i class="bi bi-circle-fill" style="font-size: 8px;"></i> Repartidor Activo</small>
                </div>
            </div>
            <a href="../auth/login.html" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right"></i></a>
        </div>
    </header>

    <div class="container" style="max-width: 600px;">
        <div class="card bg-dark border-secondary text-light mb-3">
            <div class="card-body p-3 d-flex justify-content-between align-items-center">
                <div>
                    <div class="fw-bold fs-6">Carlos Rodríguez (Repartidor)</div>
                    <small class="text-light opacity-75">Zona Norte Bogotá</small>
                </div>
                <span class="badge bg-warning text-dark fs-6 px-3 py-2">3 Envíos Hoy</span>
            </div>
        </div>

        <h6 class="fw-bold text-warning mb-3"><i class="bi bi-list-task me-1"></i> Lista de Entregas Asignadas</h6>

        <!-- TARJETA ENTREGA 1 -->
        <div class="delivery-card shadow-sm">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <span class="badge bg-warning text-dark">EN RUTA</span>
                <span class="fw-bold text-warning">Orden #VEN-1042</span>
            </div>
            <h5 class="fw-bold text-light mb-1">Cliente: Laura Mendoza</h5>
            <p class="small text-light opacity-75 mb-2"><i class="bi bi-geo-alt-fill text-warning me-1"></i> Calle 127 #15-45, Apt 302</p>
            <p class="small text-light opacity-75 mb-3"><i class="bi bi-telephone-fill text-info me-1"></i> 310 987 6543</p>
            
            <div class="bg-dark p-2 rounded mb-3 small border border-secondary">
                <strong>Pedido:</strong> 2x Queso Crema Feijoa 130g
                <div class="text-warning fw-bold mt-1">Cobro Efectivo: $20.000 COP</div>
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-success fw-bold btn-sm" onclick="alert('¡Entrega realizada exitosamente en sistema!'); this.disabled=true; this.innerText='✓ Entregado';">
                    <i class="bi bi-check-circle me-1"></i> Confirmar Entrega Realizada
                </button>
            </div>
        </div>
    </div>

    <script src="../../assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
