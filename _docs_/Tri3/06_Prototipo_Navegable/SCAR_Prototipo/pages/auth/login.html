<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema SCAR</title>
    <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/styles(Login).css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">   
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <img src="../../assets/img/Logo software.png" alt="Logo SCAR" width="80" height="84" class="mb-2" onerror="this.src='../../assets/img/Logo empresa.jpg'">
            <h4 class="fw-bold text-warning mb-1">SISTEMA SCAR</h4>
            <p class="small text-light opacity-75">Control & Administración • Dulce Dip</p>
        </div>

        <form id="formLogin" onsubmit="ejecutarIngreso(event)">
            <div class="mb-3">
                <label class="form-label small text-light fw-bold">Seleccionar Rol de Acceso</label>
                <select class="form-select bg-dark text-light border-secondary" id="selectRol" required>
                    <option value="admin" selected>Administrador (Doña Neila)</option>
                    <option value="vendedor">Vendedor</option>
                    <option value="repartidor">Repartidor / Domiciliario</option>
                    <option value="cliente">Cliente</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label small text-light fw-bold">Usuario / Correo</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="inputUser" value="usuario@dulcedip.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label small text-light fw-bold">Contraseña</label>
                <input type="password" class="form-control bg-dark text-light border-secondary" id="inputPass" value="123456" required>
            </div>

            <button type="submit" class="btn btn-success fw-bold w-100 py-2 mb-3" style="border: 1px solid #C6AF69;">
                <i class="bi bi-box-arrow-in-right me-1"></i> INGRESAR AL SISTEMA
            </button>

            <div class="text-center">
                <a href="../../index.html" class="small text-warning text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Volver al Catálogo Público
                </a>
            </div>
        </form>
    </div>

    <script src="../../assets/js/bootstrap.bundle.min.js"></script>
    <script>
        function ejecutarIngreso(e) {
            e.preventDefault();
            const rol = document.getElementById('selectRol').value;
            
            localStorage.setItem('scar_user_role', rol);

            if (rol === 'admin') {
                window.location.href = '../dashboard/admin_dashboard.html';
            } else if (rol === 'vendedor') {
                window.location.href = '../dashboard/venta_dashboard.html';
            } else if (rol === 'repartidor') {
                window.location.href = '../dashboard/domicilios_dashboard.html';
            } else if (rol === 'cliente') {
                window.location.href = '../../index.html?logged=cliente';
            }
        }
    </script>
</body>
</html>
