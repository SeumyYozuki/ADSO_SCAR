<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuste de Inventario - SCAR Dulce Dip</title>
    
    <!-- CSS Bootstrap local y personalizado -->
    <link rel="stylesheet" href="../../../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/css/styles.css">
    <link rel="stylesheet" href="../../../assets/css/styles(inventory_adjust).css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">    
</head>
<body>
<div class="d-flex min-vh-100">

        <!-- BARRA LATERAL (SIDEBAR FIXED) -->
        <aside class="sidebar d-none d-md-flex flex-column justify-content-between p-3 position-fixed top-0 start-0 bottom-0 z-3" style="width: 260px; background-color: #121A18; border-right: 1px solid rgba(198, 175, 105, 0.2); min-height: 100vh;">
            <div>
                <!-- Brand / Logo -->
                <div class="d-flex align-items-center gap-2 px-2 py-3 mb-3 border-bottom border-secondary">
                    <img src="../../../assets/img/Logo software.png" alt="Logo SCAR" width="40" height="42" class="rounded border border-warning" onerror="this.src='../../../assets/img/Logo empresa.jpg'">
                    <div>
                        <h6 class="fw-bold mb-0 text-light" style="color: #C6AF69 !important;">Sistema SCAR</h6>
                        <small class="text-warning opacity-75">Modulo Dulce Dip</small>
                    </div>
                </div>

                <!-- Menú de Navegación -->
                <nav class="nav flex-column gap-1">
                    <a href="../../dashboard/admin_dashboard.html" class="nav-link-custom p-2 rounded text-decoration-none text-light opacity-90 "><i class="bi bi-speedometer2 me-2" style="color: #C6AF69;"></i> Dashboard Main</a>
                    <a href="../../modules/users/user_read.html" class="nav-link-custom p-2 rounded text-decoration-none text-light opacity-90 "><i class="bi bi-people me-2"></i> Usuarios</a>
                    <a href="../../modules/products/product_read.html" class="nav-link-custom p-2 rounded text-decoration-none text-light opacity-90 "><i class="bi bi-box-seam me-2"></i> Productos</a>
                    <a href="../../modules/order/order_read.html" class="nav-link-custom p-2 rounded text-decoration-none text-light opacity-90 "><i class="bi bi-cart-check me-2"></i> Pedidos & Ventas</a>
                    <a href="../../modules/inventario/inventory_read.html" class="nav-link-custom p-2 rounded text-decoration-none text-light opacity-90 active fw-bold text-white bg-success"><i class="bi bi-boxes me-2"></i> Inventario</a>
                    <a href="../../modules/domicilios/delivery_read.html" class="nav-link-custom p-2 rounded text-decoration-none text-light opacity-90 "><i class="bi bi-truck me-2"></i> Domicilios</a>
                    <a href="../../modules/reportes/reports.html" class="nav-link-custom p-2 rounded text-decoration-none text-light opacity-90 "><i class="bi bi-bar-chart-line me-2"></i> Reportes</a>
                </nav>
            </div>

            <!-- Usuario Logueado & Salida -->
            <div class="border-top border-secondary pt-3 px-2">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <i class="bi bi-person-circle fs-4 text-warning"></i>
                    <div>
                        <div class="fw-bold text-light small">Usuario SCAR</div>
                        <small class="text-light opacity-50" style="font-size: 11px;">admin@dulcedip.com</small>
                    </div>
                </div>
                <a href="../../auth/login.html" class="btn btn-outline-danger btn-sm w-100 mt-1">
                    <i class="bi bi-box-arrow-left me-1"></i> Cerrar Sesión
                </a>
            </div>
        </aside>
    
<main class="main-content flex-grow-1 p-4">
    <header class="d-flex justify-content-between align-items-center mb-4 bg-dark p-3 rounded-3 border border-secondary">
        <div>
            <h4 class="fw-bold text-light mb-0">Ajuste de Inventario</h4>
            <small class="text-warning">Registro de entrada o salida de materia prima</small>
        </div>
        <a href="inventory_read.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver</a>
    </header>

    <div class="card bg-dark border-secondary text-light" style="max-width: 750px; margin: 0 auto;">
        <div class="card-body p-4">
            <form action="inventory_read.html">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label fw-bold small">Seleccionar Insumo *</label>
                        <select class="form-select bg-secondary text-light border-0"><option>Queso Crema Base</option><option>Frascos Vidrio 130g</option></select>
                    </div>
                    <div class="col-md-6"><label class="form-label fw-bold small">Tipo Movimiento</label>
                        <select class="form-select bg-secondary text-light border-0"><option>Entrada (Compra de Insumos)</option><option>Salida (Producción de Dulces)</option></select>
                    </div>
                    <div class="col-md-6"><label class="form-label fw-bold small">Cantidad *</label><input type="number" class="form-control bg-secondary text-light border-0" value="10"></div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="inventory_read.html" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success fw-bold px-4">Guardar Ajuste</button>
                </div>
            </form>
        </div>
    </div>
</main>

</div>
    <script src="../../../assets/js/bootstrap.bundle.min.js"></script>
</body>
